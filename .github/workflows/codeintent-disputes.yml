name: CodeIntent disputes

# `/reject F-xxxxxxxx -- reason`, `/withdraw ...` and `/uphold ...` PR comments.
# Runs from the default branch: it never checks out PR code, and the comment text
# reaches the script only through an environment variable (it is untrusted input).
# The CodeIntent API records the dispute in the governance ledger; this workflow
# posts its reply and re-runs the checks after a withdrawal. No GitHub App needed.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write          # reply in the PR conversation
  pull-requests: write   # reply in a review thread
  actions: write         # re-run the CodeIntent checks after a withdrawal

concurrency:
  group: codeintent-disputes-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispute:
    if: >-
      github.event.comment.user.type != 'Bot'
      && (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
      && (contains(github.event.comment.body, '/reject') || contains(github.event.comment.body, '/withdraw')
          || contains(github.event.comment.body, '/uphold'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record the dispute and reply
        env:
          API_URL: ${{ vars.CODEINTENT_DISPUTES_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/disputes' }}
          API_KEY: ${{ secrets.DRIFT_GATE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CHECKS_WORKFLOW: ${{ vars.CODEINTENT_CHECKS_WORKFLOW || 'codeintent-checks.yml' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          env = os.environ
          repo, number, actor = env['REPOSITORY'], env['PR_NUMBER'], env['ACTOR']

          def gh(*args):
              run = subprocess.run(['gh', 'api', *args], capture_output=True, text=True)
              return run.stdout if run.returncode == 0 else None

          head = env.get('REVIEW_HEAD_SHA') or json.loads(gh(f'repos/{repo}/pulls/{number}'))['head']['sha']
          # The commenter's access decides who may withdraw or uphold (@repo-writers).
          permission = (gh(f'repos/{repo}/collaborators/{actor}/permission', '--jq', '.permission') or 'none').strip()
          if permission not in {'admin', 'maintain', 'write', 'triage', 'read', 'none'}:
              permission = 'none'
          payload = {'repository': repo, 'pull_request': int(number), 'head_sha': head,
                     'comment_id': int(env['COMMENT_ID']), 'comment_url': env['COMMENT_URL'],
                     'actor': actor, 'actor_permission': permission, 'body': env['COMMENT_BODY']}
          if not env['API_KEY']:
              raise SystemExit('::error::Configure the DRIFT_GATE_API_KEY repository secret.')
          request = urllib.request.Request(env['API_URL'], data=json.dumps(payload).encode(), method='POST',
              headers={'x-api-key': env['API_KEY'], 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'::error::CodeIntent disputes API returned HTTP {exc.code}: '
                               + exc.read().decode(errors='replace')[:500])
          print(json.dumps({k: v for k, v in result.items() if k != 'reply'}))
          if not result.get('reply'):
              raise SystemExit(0)   # an ordinary comment that only mentions a command

          def reply(text):
              if env['EVENT_NAME'] == 'pull_request_review_comment':
                  target = f'repos/{repo}/pulls/{number}/comments/{env["COMMENT_ID"]}/replies'
              else:
                  target = f'repos/{repo}/issues/{number}/comments'
              if gh('--method', 'POST', target, '-f', 'body=' + text) is None:
                  print('::warning::Could not post the dispute reply:\n' + text)

          reply(result['reply'])
          if result.get('rerun'):
              # The API marked this head for a fresh run, so a re-run runs the checks again.
              runs = json.loads(gh(f'repos/{repo}/actions/workflows/{env["CHECKS_WORKFLOW"]}/runs'
                                   f'?head_sha={head}&per_page=1') or '{}').get('workflow_runs') or []
              if not runs or runs[0].get('status') != 'completed' \
                      or gh('--method', 'POST', f'repos/{repo}/actions/runs/{runs[0]["id"]}/rerun') is None:
                  reply('Could not re-run the CodeIntent checks automatically; push or re-run them to update this PR.')
          PY
